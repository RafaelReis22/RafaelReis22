<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ab4f8" />
      <stop offset="50%" stop-color="#c58af9" />
      <stop offset="100%" stop-color="#f88ad1" />
    </linearGradient>

    <!-- Grid Pattern for Tech Aesthetic -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    
    <!-- Blur Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Abstract Glowing Shapes (Cyberpunk Theme) -->
  <circle cx="1000" cy="100" r="150" fill="#c58af9" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="300" r="180" fill="#8ab4f8" opacity="0.1" filter="url(#glow)" />

  <!-- Code/Tech Decorative Elements -->
  <g opacity="0.15" transform="translate(850, 80)">
    <text x="0" y="30" font-family="monospace" font-size="14" fill="#8ab4f8">&lt;code&gt;</text>
    <text x="20" y="60" font-family="monospace" font-size="14" fill="#c58af9">const developer = {</text>
    <text x="40" y="90" font-family="monospace" font-size="14" fill="#ffffff">name: "Rafael Reis",</text>
    <text x="40" y="120" font-family="monospace" font-size="14" fill="#ffffff">focus: ["Java", "Spring", "Node"],</text>
    <text x="40" y="150" font-family="monospace" font-size="14" fill="#ffffff">architecture: "Clean &amp; SOLID"</text>
    <text x="20" y="180" font-family="monospace" font-size="14" fill="#c58af9">};</text>
    <text x="0" y="210" font-family="monospace" font-size="14" fill="#8ab4f8">&lt;/code&gt;</text>
  </g>

  <!-- Main Typography -->
  <g transform="translate(100, 160)">
    <!-- Main Name -->
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="url(#text-grad)" letter-spacing="2">
      RAFAEL REIS
    </text>
    <!-- Subtitle / Title -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" fill="#a9b1d6" letter-spacing="4">
      SOFTWARE ENGINEER &amp; ARCHITECT
    </text>
    <!-- Decorative Line -->
    <line x1="0" y1="115" x2="300" y2="115" stroke="#c58af9" stroke-width="3" opacity="0.8" />
  </g>
</svg>
